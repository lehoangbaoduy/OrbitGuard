[project]
name = "orbit-guard"
version = "0.1.0"
description = "OrbitGuard — Orbital Reinforcement-Based Intelligent Traffic Guard: a research simulator for adaptive multi-agent satellite collision avoidance."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit_guard"]
