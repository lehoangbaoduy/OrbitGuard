simulation:
  N: 15
  N_range: [10, 20]
  physics_dt_s: 10
  control_dt_s: 60
  lookahead_s: 1800
  episode_horizon_s: 21600

dynamics:
  model: two_body_j2
  integrator: rk4

sensing:
  noise_model: gaussian
  position_sigma_m: 100
  velocity_sigma_mps: 0.1
  covariance_mode: true_estimate

collision:
  hard_body_radius_m: 5.0

risk:
  model: normalized_separation_proxy
  epsilon_m: 1.0
  z0: 3.0
  k: 1.5

adaptive_margin:
  d_base_m: 1000
  d_min_m: 200
  d_max_m: 5000
  alpha: 1.0
  beta: 0.5
  gamma: 1.0
  density_radius_km: 50
  density_ref_count: 5

rl:
  algorithm: mappo
  parameter_sharing: true
  num_training_seeds: 3
  # Tuned for the P3-M5 2-satellite gate (docs/OrbitGuard_progress.md, tuning record); PRD §39 start: lr 3e-4, gamma 0.99, entropy 0.01.
  learning_rate: 5.0e-4
  gamma: 0.95
  gae_lambda: 0.95
  clip_param: 0.2
  entropy_coeff: 0.005
  train_batch_size: 4000
  sgd_minibatch_size: 256
  num_sgd_iter: 10
  actor_hidden_layers: [128, 128]
  critic_hidden_layers: [256, 256]
  # Critic input (prereg R4 A/B): global = global state only; agent_global = [own local obs | global state] (MAPPO).
  critic_input: agent_global  # prereg R4 outcome (2026-11-03): B adopted, vf_explained_var 0.214 vs 0.033
  vf_clip_param: 1000000.0
  reward_scale: 1.0
  reward_offset: -1.0  # training-only centering of the +1/step baseline; evaluation uses raw rewards
  num_env_runners: 0

observation:
  k_neighbors: 4

maneuver:
  base_delta_v_mps: 0.1
  phase_fraction: 0.5

capability:
  remaining_delta_v_mps: 2.0  # nominal per-satellite budget (PRD §39 default); observation scale and replay meta
  # PRD §17 per-episode randomization: each satellite's initial budget ~ Uniform(range) at reset, mean 2.0, ±25%.
  # PROVISIONAL astro-adjacent choice (CORE-3); null = every satellite starts with remaining_delta_v_mps.
  remaining_delta_v_range_mps: [1.5, 2.5]
  mission_deviation_limit: 1.0

reward:
  w1_safety: 1.0
  w2_mission: 0.3
  w3_delta_v: 5.0  # PRD §39 start was 0.1; too weak to discourage indiscriminate burns (tuning record)
  w4_coordination: 0.5
  collision_penalty: -100
  coordination_clip: 1.0  # PRD §25 clipping (Q13 closed by CORE-2): min(clip, summed one-sided risk degradation)
  mission_weights: {q_a: 0.25, q_e: 0.25, q_i: 0.25, q_M: 0.25}

shield:
  repair_mode: bounded_joint_search
  exact_enumeration_max_agents: 4
  beam_width: 50

# The five compared models (PRD §31, §35). Switching `experiment.model` between these keys is the
# ONLY change needed to run a different baseline (FR14). `margin` picks the safety margin used for the
# model's observations/reward/shield; outcome metrics always use the adaptive margin as the common
# reference. The fixed margin's constant is the mean adaptive d_safe over the validation scenarios
# under no manoeuvres (frozen once; see docs/OrbitGuard_progress.md).
models:
  no_maneuver: {policy: no_maneuver, shield: false, margin: adaptive}
  rule_based: {policy: rule_based, shield: false, margin: adaptive}
  fixed_margin_mappo: {policy: mappo, shield: true, margin: fixed}
  adaptive_mappo: {policy: mappo, shield: true, margin: adaptive}
  adaptive_mappo_no_shield: {policy: mappo, shield: false, margin: adaptive}

fixed_margin:
  d_safe_m: 1142.0  # measured: mean adaptive d_safe over 12 validation scenarios, N=15, no manoeuvres (1141.9 m)

# Zero-shot distribution-shift conditions (PRD §32). Magnitudes are provisional astro choices:
# noise_scale multiplies the training sensing sigmas (3x is beyond the training range, which is a
# single fixed value); phase_spread_rad is the std of the clustered RAAN/arg-periapsis/mean-anomaly
# window (N is unchanged); simultaneous conjunctions use the 3-pair episode type (training maxes at 2);
# capability_reduction disables/limits the satellites most in need of manoeuvring.
shifts:
  normal: {}
  noise_increase: {noise_scale: 3.0}
  density_increase: {phase_spread_rad: 0.015}
  simultaneous_conjunctions: {distribution_mix: {triple_conjunction: 1.0}}
  capability_reduction: {disabled_count: 2, reduced_count: 2, reduced_budget_scale: 0.25}

experiment:
  model: adaptive_mappo
  training_distribution_mix: {benign: 0.30, single_conjunction: 0.50, multi_conjunction: 0.20}
  validation_seeds: 50
  test_seeds_per_condition: 10
  evaluation_seeds_per_model: 10

data:
  tle_source: celestrak_starlink_shell
  tle_file: data/TLE_snapshot_53deg_shell.csv
  tle_format: parsed_elements_csv   # pre-parsed orbital elements, not raw TLE text
  tle_epoch_range: ["2026-09-14", "2026-09-17"]
  tle_satellite_count: 3002
  tle_inclination_range_deg: [53.04, 53.17]
  tle_altitude_range_km: [460, 465]
  snapshot_frozen: true
