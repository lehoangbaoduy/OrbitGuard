# Validation-split overlay for configs/default.yaml (PRD §33).
#
# Purpose: reward-weight tuning, adaptive-margin coefficient tuning, RL
# hyperparameter tuning, and checkpoint selection (§33) — never final-test
# evaluation.
#
# `seed_pool_file` is the fixed file of 50 validation seeds (§33, §39
# `experiment.validation_seeds: 50`), generated once by
# `python -m orbit_guard.evaluation.seed_pools` (reserved range 100000-199999,
# disjoint from the final-test range and from training-episode seeds) and
# checksummed; loaders verify `seed_pool_sha256` (see evaluation/seed_pools.py).

split: validation
num_seeds: 50
seed_pool_file: configs/validation_seeds.json
seed_pool_sha256: a2b3ad1dc8ec46f486331043930c15b3ea84917c6b552acc66dbe0f1167eeb07
